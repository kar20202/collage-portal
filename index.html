<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="theme.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Vidyalaya Portal</title>
	<style>
		:root {
			--navy: #42245f;
			--blue: #6851c7;
			--sky: #f0eaff;
			--gold: #f6b73c;
			--ink: #29213a;
			--muted: #71677f;
			--white: #ffffff;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
			background: linear-gradient(135deg, #e6dcff 0%, #fffaff 48%, #d9f5f0 100%);
		}

		.portal {
			width: min(100%, 960px);
			overflow: hidden;
			display: grid;
			grid-template-columns: 0.9fr 1.1fr;
			background: var(--white);
			border: 1px solid rgba(66, 36, 95, 0.12);
			border-radius: 18px;
			box-shadow: 0 24px 60px rgba(66, 36, 95, 0.18);
		}

		.intro {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 520px;
			padding: 48px;
			color: var(--white);
			background: linear-gradient(150deg, #42245f 0%, #6748a2 72%, #267f88 140%);
		}

		.intro::after {
			content: "";
			position: absolute;
			right: -80px;
			bottom: -100px;
			width: 260px;
			height: 260px;
			border: 36px solid rgba(246, 183, 60, 0.92);
			border-radius: 50%;
		}

		.brand {
			position: relative;
			z-index: 1;
			color: var(--gold);
			font-size: 1rem;
			font-weight: bold;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			position: relative;
			z-index: 1;
			max-width: 310px;
			font-size: clamp(2.5rem, 5vw, 4.5rem);
			line-height: 0.98;
			font-weight: 500;
		}

		.intro-text {
			position: relative;
			z-index: 1;
			max-width: 280px;
			color: #eadff8;
			font-family: Arial, sans-serif;
			font-size: 0.95rem;
			line-height: 1.6;
		}

		.choices {
			padding: 48px;
			align-self: center;
		}

		.choices h2 {
			margin-bottom: 10px;
			color: var(--navy);
			font-size: 2rem;
			font-weight: 500;
		}

		.choices > p {
			margin-bottom: 30px;
			color: var(--muted);
			font-family: Arial, sans-serif;
			line-height: 1.5;
		}

		.login-options {
			display: grid;
			gap: 16px;
		}

		.login-option {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			padding: 21px 22px;
			color: var(--navy);
			text-decoration: none;
			border: 1px solid #ddd2ef;
			border-radius: 10px;
			transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
		}

		.login-option:hover,
		.login-option:focus-visible {
			border-color: var(--blue);
			box-shadow: 0 10px 24px rgba(104, 81, 199, 0.18);
			outline: none;
			transform: translateY(-3px);
		}

		.login-option strong {
			display: block;
			margin-bottom: 5px;
			font-size: 1.15rem;
		}

		.login-option span {
			color: var(--muted);
			font-family: Arial, sans-serif;
			font-size: 0.86rem;
		}

		.arrow {
			color: var(--blue);
			font-family: Arial, sans-serif;
			font-size: 1.5rem;
		}

		@media (max-width: 700px) {
			body {
				padding: 14px;
			}

			.portal {
				grid-template-columns: 1fr;
			}

			.intro {
				min-height: 340px;
				padding: 32px;
			}

			.choices {
				padding: 32px;
			}
		}
	</style>
</head>
<body>
	<main class="portal">
		<section class="intro" aria-labelledby="welcome-heading">
			<p class="brand">Vidyalaya Portal</p>
			<h1 id="welcome-heading">Welcome back.</h1>
			<p class="intro-text">Choose your account type to continue to the vidyalaya portal.</p>
		</section>

		<section class="choices" aria-labelledby="login-heading">
			<h2 id="login-heading">Sign in to continue</h2>
			<p>Select the login page that matches your role.</p>

			<nav class="login-options" aria-label="Login options">
				<a class="login-option" href="student-login.html">
					<span>
						<strong>Student Login</strong>
						Access your student dashboard
					</span>
					<span class="arrow" aria-hidden="true">&rarr;</span>
				</a>

				<a class="login-option" href="teacher-login.html">
					<span>
						<strong>Teacher Login</strong>
						Manage your teacher account
					</span>
					<span class="arrow" aria-hidden="true">&rarr;</span>
				</a>
			</nav>
		</section>
	</main>
</body>
<script type="module">
	import { auth } from './firebase-config.js';
	import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
	onAuthStateChanged(auth, user => {
		if (!user) return;
		const student = JSON.parse(localStorage.getItem('studentAccount') || 'null');
		const teacher = JSON.parse(localStorage.getItem('teacherAccount') || 'null');
		window.location.href = student ? 'student-dash.html' : teacher ? 'teacher-dash.html' : 'student-login.html';
	});
</script>
</html>
