<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | School Portal</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --ink: #182230; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    .login-box { width: min(100%, 430px); padding: 42px; background: #fff; border-radius: 16px; box-shadow: 0 24px 60px rgba(20, 33, 61, 0.16); }
    h1 { margin-bottom: 10px; color: var(--navy); font-size: 2.4rem; font-weight: 500; }
    .subtitle { margin-bottom: 28px; color: var(--muted); font-family: Arial, sans-serif; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; color: var(--navy); font: bold 0.9rem Arial, sans-serif; }
    input, select { width: 100%; padding: 13px 14px; border: 1px solid #d8e2f0; border-radius: 8px; font: 1rem Arial, sans-serif; }
    input:focus, select:focus { border-color: var(--blue); outline: 2px solid rgba(37, 99, 235, 0.15); }
    button { width: 100%; margin-top: 24px; padding: 14px; color: #fff; background: var(--blue); border: 0; border-radius: 8px; cursor: pointer; font: bold 1rem Arial, sans-serif; }
    button:hover { background: #1d4ed8; }
    .switch { margin: 22px 0 0; color: var(--muted); font: 0.9rem Arial, sans-serif; text-align: center; }
    .switch button { width: auto; margin: 0; padding: 0; color: var(--blue); background: none; font: inherit; }
    .generated-password { display: none; margin-top: 18px; padding: 12px; color: #155e35; background: #dcfce7; border-radius: 8px; font: 0.9rem Arial, sans-serif; line-height: 1.5; }
    .generated-password strong { display: block; margin-top: 4px; font-size: 1rem; letter-spacing: 0.04em; }
    .back { display: block; margin-top: 22px; color: var(--blue); font: 0.9rem Arial, sans-serif; text-align: center; text-decoration: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main class="login-box">
    <section id="login-section">
      <h1>Student Login</h1>
      <p class="subtitle">Enter your details to access the student portal.</p>
      <form id="login-form">
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" required>
        <button type="submit">Log in</button>
      </form>
      <p class="switch">New student? <button id="show-register" type="button">Create an account</button></p>
    </section>
    <section id="register-section" hidden>
      <h1>Create Account</h1>
      <p class="subtitle">Create your student account to get started.</p>
      <form id="register-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="full-name" type="text" autocomplete="name" required>
        <label for="student-email">Real email address</label>
        <input id="student-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="branch">Branch</label>
        <select id="branch" name="branch" required><option value="">Choose a branch</option><option value="CSE">CSE</option><option value="EC">EC</option></select>
        <label for="semester">Semester</label>
        <select id="semester" name="semester" required><option value="">Choose a semester</option><option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option><option value="5">Semester 5</option><option value="6">Semester 6</option></select>
        <button type="submit">Create account</button>
      </form>
      <p id="generated-password" class="generated-password"></p>
      <p class="switch">Already registered? <button id="show-login" type="button">Log in</button></p>
    </section>
    <a class="back" href="index.html">&larr; Back to portal</a>
  </main>
  <script>
    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const generatedPassword = document.getElementById('generated-password');
    function createPassword() {
      const characters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
      return Array.from({ length: 12 }, () => characters[Math.floor(Math.random() * characters.length)]).join('');
    }
    document.getElementById('show-register').addEventListener('click', () => { loginSection.hidden = true; registerSection.hidden = false; });
    document.getElementById('show-login').addEventListener('click', () => { registerSection.hidden = true; loginSection.hidden = false; });
    document.getElementById('register-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const password = createPassword();
      const account = { fullName: formData.get('full-name'), email: formData.get('email'), branch: formData.get('branch'), semester: formData.get('semester'), password };
      const studentAccounts = JSON.parse(localStorage.getItem('studentAccounts') || '[]');
      studentAccounts.push(account);
      localStorage.setItem('studentAccounts', JSON.stringify(studentAccounts));
      localStorage.setItem('studentAccount', JSON.stringify(account));
      generatedPassword.innerHTML = 'Your generated password is:<strong>' + password + '</strong>Save it before continuing.';
      generatedPassword.style.display = 'block';
      setTimeout(() => { window.location.href = 'student-dash.html'; }, 1200);
    });
    document.getElementById('login-form').addEventListener('submit', (event) => { event.preventDefault(); window.location.href = 'student-dash.html'; });
  </script>
  <script type="module">
    import { registerAccount, loginAccount } from './firebase-data.js';
    import { auth } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    const studentLoginForm = document.getElementById('login-form');
    const studentRegisterForm = document.getElementById('register-form');
    const studentStatus = document.getElementById('generated-password');
    onAuthStateChanged(auth, user => { if (user && localStorage.getItem('studentAccount')) window.location.href = 'student-dash.html'; });
    studentRegisterForm.addEventListener('submit', async event => {
      event.preventDefault();
      event.stopImmediatePropagation();
      const data = new FormData(studentRegisterForm);
      const password = createPassword();
      const account = { fullName: data.get('full-name'), email: data.get('email'), branch: data.get('branch'), semester: data.get('semester'), password };
      try {
        await registerAccount('student', account);
        localStorage.setItem('studentAccount', JSON.stringify(account));
        studentStatus.innerHTML = 'Account created. Your password is:<strong>' + password + '</strong>';
        studentStatus.style.display = 'block';
        setTimeout(() => { window.location.href = 'student-dash.html'; }, 1200);
      } catch (error) { studentStatus.textContent = error.message; studentStatus.style.display = 'block'; }
    }, true);
    studentLoginForm.addEventListener('submit', async event => {
      event.preventDefault();
      event.stopImmediatePropagation();
      const data = new FormData(studentLoginForm);
      try { const result = await loginAccount(data.get('email'), data.get('password')); localStorage.setItem('studentAccount', JSON.stringify(result.profile)); window.location.href = 'student-dash.html'; }
      catch (error) { studentStatus.textContent = error.message; studentStatus.style.display = 'block'; }
    }, true);
  </script>
</body>
</html>
