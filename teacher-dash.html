<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --ink: #182230; --muted: #64748b; --white: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; color: var(--ink); font-family: Arial, sans-serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 6vw; color: var(--white); background: var(--navy); }
    .brand { color: #f4b942; font: bold 0.85rem Georgia, serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .profile-actions { display: flex; align-items: center; gap: 12px; }
    .profile-link, .logout { border: 0; cursor: pointer; font: 0.9rem Arial, sans-serif; text-decoration: none; }
    .profile-link { color: var(--white); }
    .profile-link:hover { color: #f4b942; }
    .logout { padding: 9px 14px; color: var(--navy); background: #f4b942; border-radius: 7px; }
    .layout { width: min(1100px, 88%); margin: 54px auto; }
    .welcome { margin-bottom: 32px; }
    .welcome small { color: var(--blue); font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin-top: 8px; color: var(--navy); font: 500 clamp(2rem, 5vw, 3.6rem) Georgia, serif; }
    .welcome p { margin-top: 10px; color: var(--muted); }
    .section-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .section-card { display: flex; min-height: 140px; flex-direction: column; justify-content: space-between; padding: 24px; color: var(--navy); background: var(--white); border: 1px solid rgba(20, 33, 61, 0.1); border-radius: 12px; box-shadow: 0 12px 28px rgba(20, 33, 61, 0.08); text-decoration: none; transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease; }
    .section-card:hover, .section-card:focus-visible { border-color: var(--blue); box-shadow: 0 16px 30px rgba(37, 99, 235, 0.15); outline: none; transform: translateY(-3px); }
    .section-card strong { font: 500 1.3rem Georgia, serif; }
    .section-card span { color: var(--blue); font-size: 1.35rem; text-align: right; }
    @media (max-width: 760px) { .section-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px) { .topbar { align-items: flex-start; flex-direction: column; } .layout { margin: 36px auto; } .section-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <p class="brand">Vidyalaya Portal</p>
    <div class="profile-actions">
      <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
      <button class="logout" id="logout" type="button">Log out</button>
    </div>
  </header>
  <main class="layout">
    <section class="welcome" aria-labelledby="welcome-heading">
      <small>Teacher dashboard</small>
      <h1 id="welcome-heading">Welcome Professor <span id="teacher-name">Teacher</span></h1>
      <p>Choose a section to manage your classes and student resources.</p>
    </section>
    <nav class="section-grid" aria-label="Teacher dashboard sections">
      <a class="section-card" href="upload-classes.html"><strong>Upload Classes</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="my-classes.html"><strong>My Classes</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="generate-qr.html"><strong>Generate QR</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="student.html"><strong>Students</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="upload-notice.html"><strong>Upload Notice</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="upload.html"><strong>Upload Notes</strong><span aria-hidden="true">&rarr;</span></a>
      <a class="section-card" href="teacher-profile.html"><strong>My Profile</strong><span aria-hidden="true">&rarr;</span></a>
    </nav>
  </main>
  <script>
    const teacherAccount = JSON.parse(localStorage.getItem('teacherAccount') || 'null');
    if (teacherAccount && teacherAccount.fullName) document.getElementById('teacher-name').textContent = teacherAccount.fullName;
    document.getElementById('logout').addEventListener('click', () => {
      localStorage.removeItem('teacherAccount');
      window.location.href = 'teacher-login.html';
    });
  </script>
</body>
<script type="module">
  import { logoutAccount } from './firebase-data.js';
  document.getElementById('logout').addEventListener('click', async event => {
    event.preventDefault();
    event.stopImmediatePropagation();
    await logoutAccount();
    localStorage.removeItem('teacherAccount');
    window.location.href = 'teacher-login.html';
  }, true);
</script>
</html>
