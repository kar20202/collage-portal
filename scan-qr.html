<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR | Student Portal</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--navy); font-family: Arial, sans-serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    main { width: min(100%, 650px); padding: 42px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(20, 33, 61, 0.14); }
    h1 { font: 500 2.5rem Georgia, serif; }
    .intro { margin: 12px 0 24px; color: var(--muted); line-height: 1.6; }
    .camera-box { position: relative; overflow: hidden; min-height: 280px; background: #0f172a; border-radius: 10px; }
    video { display: block; width: 100%; min-height: 280px; object-fit: cover; }
    canvas { display: none; }
    .camera-placeholder { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #cbd5e1; text-align: center; }
    .controls { display: flex; gap: 12px; margin-top: 18px; }
    button { flex: 1; padding: 13px; color: #fff; background: var(--blue); border: 0; border-radius: 7px; cursor: pointer; font: bold 1rem Arial, sans-serif; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .stop { background: #64748b; }
    .status { margin-top: 18px; padding: 13px; color: var(--muted); background: #f4f7fb; border-radius: 8px; line-height: 1.5; }
    .success { color: #155e35; background: #dcfce7; }
    .error { color: #9a3412; background: #ffedd5; }
    .back { display: inline-block; margin-top: 24px; color: var(--blue); text-decoration: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
  <main>
    <h1>Scan Class QR</h1>
    <p class="intro">Allow camera access and scan the QR code displayed by your teacher to mark attendance.</p>
    <section class="camera-box">
      <video id="camera" playsinline></video>
      <canvas id="canvas"></canvas>
      <p id="placeholder" class="camera-placeholder">Press Start camera, then point your camera at the class QR code.</p>
    </section>
    <div class="controls">
      <button id="start" type="button">Start camera</button>
      <button id="stop" class="stop" type="button" disabled>Stop camera</button>
    </div>
    <p id="status" class="status" role="status">Camera is off.</p>
    <a class="back" href="student-dash.html">Back to student dashboard</a>
  </main>
  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d', { willReadFrequently: true });
    const placeholder = document.getElementById('placeholder');
    const status = document.getElementById('status');
    const startButton = document.getElementById('start');
    const stopButton = document.getElementById('stop');
    const student = JSON.parse(localStorage.getItem('studentAccount') || 'null');
    let cameraStream;
    let scanning = false;
    const barcodeDetector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = `status ${type}`;
    }
    function stopCamera() {
      scanning = false;
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      video.srcObject = null;
      startButton.disabled = false;
      stopButton.disabled = true;
      placeholder.hidden = false;
    }
    function recordAttendance(classData) {
      if (!student || !student.fullName) throw new Error('Please create a student account before scanning.');
      if (!classData || classData.type !== 'school-class' || !classData.id || !classData.className) throw new Error('Wrong QR code. Scan the QR generated by your teacher.');
      if (!classData.qrToken || !classData.expiresAt) throw new Error('Wrong QR code. Scan the current QR generated by your teacher.');
      if (Date.now() > Number(classData.expiresAt)) throw new Error('Wrong QR code. This class QR has expired.');
      const joined = JSON.parse(localStorage.getItem('studentJoinedClasses') || '[]');
      if (!joined.some(item => item.id === classData.id)) {
        joined.push({ ...classData, scannedAt: new Date().toISOString() });
        localStorage.setItem('studentJoinedClasses', JSON.stringify(joined));
      }
      const classes = JSON.parse(localStorage.getItem('classes') || '[]');
      const classIndex = classes.findIndex(item => item.id === classData.id);
      if (classIndex >= 0) {
        const scannedStudents = Array.isArray(classes[classIndex].scannedStudents) ? classes[classIndex].scannedStudents : [];
        const alreadyScanned = scannedStudents.some(scan => scan.email === student.email || scan.name === student.fullName);
        if (!alreadyScanned) {
          scannedStudents.push({ name: student.fullName, email: student.email, scannedAt: new Date().toISOString() });
          classes[classIndex].scannedStudents = scannedStudents;
          classes[classIndex].joinedCount = scannedStudents.length;
          localStorage.setItem('classes', JSON.stringify(classes));
          window.firebaseAddAttendance?.(classData.id, { name: student.fullName, email: student.email, scannedAt: new Date().toISOString() });
        }
      }
      return classData;
    }
    function processCodeData(data) {
      try {
        const classData = recordAttendance(JSON.parse(data));
        stopCamera();
        showStatus(`Attendance marked for ${classData.className}.`, 'success');
        return true;
      } catch (error) {
        showStatus(error.message || 'Wrong QR code. Scan the QR generated by your teacher.', 'error');
        return false;
      }
    }
    async function scanFrame() {
      if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) return requestAnimationFrame(scanFrame);
      if (barcodeDetector) {
        try {
          const results = await barcodeDetector.detect(video);
          if (results.length && processCodeData(results[0].rawValue)) return;
        } catch (error) {}
      }
      if (typeof jsQR !== 'function') return requestAnimationFrame(scanFrame);
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const image = context.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(image.data, image.width, image.height, { inversionAttempts: 'attemptBoth' });
      if (code && processCodeData(code.data)) return;
      requestAnimationFrame(scanFrame);
    }
    startButton.addEventListener('click', async () => {
      if (!barcodeDetector && typeof jsQR !== 'function') {
        showStatus('QR scanner library could not load. Check your internet connection and refresh.', 'error');
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        showStatus('Camera access requires HTTPS or localhost.', 'error');
        return;
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = cameraStream;
        await video.play();
        scanning = true;
        placeholder.hidden = true;
        startButton.disabled = true;
        stopButton.disabled = false;
        showStatus('Camera is on. Point it at the teacher QR code.');
        requestAnimationFrame(scanFrame);
      } catch (error) {
        showStatus('Camera permission was denied or the camera is unavailable.', 'error');
      }
    });
    stopButton.addEventListener('click', () => { stopCamera(); showStatus('Camera is off.'); });
    window.addEventListener('pagehide', stopCamera);
  </script>
  <script type="module">
    import { addAttendance } from './firebase-data.js';
    window.firebaseAddAttendance = (classId, student) => addAttendance(classId, student);
  </script>
</body>
</html>
