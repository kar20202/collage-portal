<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>View Notices</title><style>:root{--navy:#14213d;--blue:#2563eb;--muted:#64748b}*{box-sizing:border-box}body{min-height:100vh;padding:38px 24px;color:var(--navy);font-family:Arial,sans-serif;background:linear-gradient(135deg,#dcecff,#fff3d6)}main{width:min(100%,800px);margin:auto;padding:42px;background:#fff;border-radius:14px;box-shadow:0 20px 50px #14213d24}h1{font:500 2.5rem Georgia,serif}.intro{margin:10px 0 28px;color:var(--muted)}.list{display:grid;gap:14px}.notice{padding:20px;border:1px solid #d8e2f0;border-radius:10px}.notice h2{font:500 1.3rem Georgia,serif}.notice p{margin-top:8px;color:var(--muted);white-space:pre-wrap;line-height:1.6}.notice small{display:block;margin-top:12px;color:var(--muted)}.notice img{max-width:100%;max-height:260px;margin-top:12px;border-radius:8px}.empty{padding:18px;color:var(--muted);background:#f4f7fb;border-radius:8px}.back{display:inline-block;margin-top:26px;color:var(--blue);text-decoration:none}</style></head><body><main><h1>View Notices</h1><p class="intro">Notices published by your teachers.</p><section id="list" class="list"></section><a class="back" href="student-dash.html">Back to student dashboard</a></main><script type="module">import { watchNotices } from './firebase-data.js';const list=document.getElementById('list');function render(notices){list.innerHTML='';if(!notices.length){list.innerHTML='<p class="empty">No notices published yet.</p>';return;}notices.reverse().forEach(notice=>{const card=document.createElement('article');card.className='notice';const title=document.createElement('h2');title.textContent=notice.title;const body=document.createElement('p');body.textContent=notice.content||'Image notice';const meta=document.createElement('small');meta.textContent=`Teacher: ${notice.teacherName} | Published: ${new Date(notice.createdAt).toLocaleString()}`;card.append(title,body,meta);if(notice.image){const image=document.createElement('img');image.src=notice.image;image.alt=notice.title;card.appendChild(image);}list.appendChild(card);});}watchNotices(data=>render(Object.values(data)));</script></body></html>
