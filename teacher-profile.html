<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Teacher Profile</title><style>body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;color:#14213d;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dcecff,#fff3d6)}main{width:min(100%,500px);padding:42px;background:#fff;border-radius:14px;box-shadow:0 20px 50px #14213d24}h1{margin:0 0 24px;font:500 2.5rem Georgia,serif}dl{display:grid;grid-template-columns:110px 1fr;gap:14px 18px;margin:0}dt{color:#64748b;font-weight:bold}dd{margin:0}button,.back{display:inline-block;margin-top:28px;padding:12px 16px;border-radius:7px;font:1rem Arial,sans-serif;text-decoration:none;cursor:pointer}.back{color:#2563eb;background:#e8f1ff}.logout{color:#fff;background:#2563eb;border:0}</style></head><body><main><h1>Teacher Profile</h1><dl><dt>Name</dt><dd id="name">Teacher</dd><dt>Branch</dt><dd id="branch">-</dd><dt>Subject</dt><dd id="subject">-</dd><dt>Email</dt><dd id="email">-</dd></dl><a class="back" href="teacher-dash.html">Back to dashboard</a><button class="logout" id="logout" type="button">Log out</button></main><script>const account=JSON.parse(localStorage.getItem('teacherAccount')||'null');if(account){document.getElementById('name').textContent=account.fullName||'-';document.getElementById('branch').textContent=account.branch||'-';document.getElementById('subject').textContent=account.subject||'-';document.getElementById('email').textContent=account.email||'-';}document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('teacherAccount');window.location.href='teacher-login.html';});</script></body></html>
