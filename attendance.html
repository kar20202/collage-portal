<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance | Student Portal</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 38px 24px; color: var(--navy); font-family: Arial, sans-serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    main { width: min(100%, 760px); margin: 0 auto; padding: 42px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(20, 33, 61, 0.14); }
    h1 { font: 500 2.5rem Georgia, serif; }
    .intro { margin: 10px 0 26px; color: var(--muted); line-height: 1.6; }
    label { display: block; margin-bottom: 7px; color: var(--navy); font-weight: bold; font-size: 0.9rem; }
    select { width: 100%; padding: 13px; border: 1px solid #d8e2f0; border-radius: 7px; background: #fff; font: 1rem Arial, sans-serif; }
    select:focus { border-color: var(--blue); outline: 2px solid rgba(37, 99, 235, 0.15); }
    .result { margin-top: 28px; padding: 24px; background: #e8f1ff; border-radius: 10px; }
    .result h2 { margin-bottom: 18px; font: 500 1.5rem Georgia, serif; }
    .percentage { margin-bottom: 22px; color: var(--blue); font-size: 3.4rem; font-weight: bold; }
    .percentage small { color: var(--muted); font-size: 1rem; font-weight: normal; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { padding: 14px; background: #fff; border-radius: 8px; text-align: center; }
    .stat strong { display: block; color: var(--navy); font-size: 1.5rem; }
    .stat span { color: var(--muted); font-size: 0.82rem; }
    .empty { margin-top: 24px; padding: 18px; color: var(--muted); background: #f4f7fb; border-radius: 8px; }
    .back { display: inline-block; margin-top: 26px; color: var(--blue); text-decoration: none; }
    @media (max-width: 520px) { main { padding: 28px; } .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Attendance</h1>
    <p class="intro">Select a subject to view your attendance percentage.</p>
    <label for="subject-filter">Select subject</label>
    <select id="subject-filter">
      <option value="all">All subjects</option>
      <option>Math</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>FEEE</option>
      <option>Engineering Graphics</option>
    </select>
    <section id="attendance-result" class="result" aria-live="polite"></section>
    <a class="back" href="student-dash.html">Back to student dashboard</a>
  </main>
  <script>
    const localClasses = JSON.parse(localStorage.getItem('classes') || '[]');
    const joinedClasses = JSON.parse(localStorage.getItem('studentJoinedClasses') || '[]');
    const classes = [...localClasses];
    joinedClasses.forEach(joinedClass => {
      if (!classes.some(item => item.id === joinedClass.id)) classes.push(joinedClass);
    });
    const filter = document.getElementById('subject-filter');
    const result = document.getElementById('attendance-result');
    function subjectKey(subject) {
      const value = String(subject || '').trim().toLowerCase();
      return value === 'mathematics' ? 'math' : value;
    }
    function attended(classItem) {
      const student = JSON.parse(localStorage.getItem('studentAccount') || 'null');
      if (joinedClasses.some(joinedClass => joinedClass.id === classItem.id)) return true;
      return Object.values(classItem.scannedStudents || {}).some(scan => scan.email === student?.email || scan.name === student?.fullName);
    }
    function renderAttendance() {
      const selectedSubject = filter.value;
      const subjectClasses = classes.filter(item => selectedSubject === 'all' || subjectKey(item.subject) === subjectKey(selectedSubject));
      const attendedClasses = subjectClasses.filter(attended).length;
      const missedClasses = subjectClasses.length - attendedClasses;
      const percentage = subjectClasses.length ? Math.round((attendedClasses / subjectClasses.length) * 100) : 0;
      const title = selectedSubject === 'all' ? 'All Subjects' : selectedSubject;
      if (!subjectClasses.length) {
        result.innerHTML = `<h2>${title}</h2><p class="empty">No classes are available for this subject yet.</p>`;
        return;
      }
      result.innerHTML = `<h2>${title}</h2><div class="percentage">${percentage}% <small>attendance</small></div><div class="stats"><div class="stat"><strong>${subjectClasses.length}</strong><span>Total classes</span></div><div class="stat"><strong>${attendedClasses}</strong><span>Attended</span></div><div class="stat"><strong>${missedClasses}</strong><span>Missed</span></div></div>`;
    }
    filter.addEventListener('change', renderAttendance);
    renderAttendance();
  </script>
  <script type="module">
    import { watchClasses } from './firebase-data.js';
    watchClasses(remoteClasses => {
      const next = JSON.stringify(Object.values(remoteClasses));
      if (localStorage.getItem('classes') !== next) { localStorage.setItem('classes', next); window.location.reload(); }
    });
  </script>
</body>
</html>
