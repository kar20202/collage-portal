<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publish Notice | Teacher Portal</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --ink: #182230; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 38px 24px; color: var(--ink); font-family: Arial, sans-serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    main { width: min(100%, 760px); margin: 0 auto; padding: 42px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(20, 33, 61, 0.14); }
    h1 { color: var(--navy); font: 500 2.5rem Georgia, serif; }
    .intro { margin: 10px 0 28px; color: var(--muted); line-height: 1.6; }
    label { display: block; margin: 17px 0 7px; color: var(--navy); font-weight: bold; font-size: 0.9rem; }
    input, textarea, button { width: 100%; padding: 13px; border-radius: 7px; font: 1rem Arial, sans-serif; }
    input, textarea { border: 1px solid #d8e2f0; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    input:focus, textarea:focus { border-color: var(--blue); outline: 2px solid rgba(37, 99, 235, 0.15); }
    button { margin-top: 24px; color: #fff; background: var(--blue); border: 0; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .status { display: none; margin-top: 16px; padding: 12px; color: #155e35; background: #dcfce7; border-radius: 8px; }
    .published { margin-top: 36px; padding-top: 28px; border-top: 1px solid #d8e2f0; }
    .published h2 { color: var(--navy); font: 500 1.5rem Georgia, serif; }
    .notice-list { display: grid; gap: 12px; margin-top: 16px; }
    .notice-card { padding: 16px; border: 1px solid #d8e2f0; border-radius: 9px; }
    .notice-card h3 { color: var(--navy); font-size: 1.05rem; }
    .notice-card p { margin-top: 7px; color: var(--muted); white-space: pre-wrap; line-height: 1.5; }
    .notice-card small { display: block; margin-top: 10px; color: var(--muted); }
    .notice-image { display: block; max-width: 100%; max-height: 180px; margin-top: 12px; border-radius: 7px; }
    .back { display: inline-block; margin-top: 26px; color: var(--blue); text-decoration: none; }
    .hint { margin-top: 7px; color: var(--muted); font-size: 0.83rem; }
  </style>
</head>
<body>
  <main>
    <h1>Publish Notice</h1>
    <p class="intro">Create a notice for students using text, an image, or both.</p>
    <form id="notice-form">
      <label for="notice-title">Notice title</label>
      <input id="notice-title" name="title" type="text" placeholder="For example: Midterm exam schedule" required>
      <label for="notice-content">Notice content</label>
      <textarea id="notice-content" name="content" placeholder="Write the notice for your students..."></textarea>
      <label for="notice-image">Notice image</label>
      <input id="notice-image" name="image" type="file" accept="image/*">
      <p class="hint">Add text, an image, or both. Maximum image size: 5 MB.</p>
      <button type="submit">Publish notice</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <section class="published">
      <h2>Recently published</h2>
      <div id="notice-list" class="notice-list"></div>
    </section>
    <a class="back" href="teacher-dash.html">Back to dashboard</a>
  </main>
  <script>
    const teacherAccount = JSON.parse(localStorage.getItem('teacherAccount') || 'null');
    if (!teacherAccount) window.location.href = 'teacher-login.html';
    const noticeForm = document.getElementById('notice-form');
    const imageInput = document.getElementById('notice-image');
    const status = document.getElementById('status');
    const noticeList = document.getElementById('notice-list');
    const readImage = file => new Promise((resolve, reject) => {
      if (!file) return resolve('');
      if (file.size > 5 * 1024 * 1024) return reject(new Error('The image must be 5 MB or smaller.'));
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('The image could not be read.'));
      reader.readAsDataURL(file);
    });
    function renderNotices() {
      const notices = JSON.parse(localStorage.getItem('notices') || '[]').filter(item => item.teacherEmail === teacherAccount.email);
      noticeList.innerHTML = '';
      if (!notices.length) {
        noticeList.innerHTML = '<p class="hint">No notices published yet.</p>';
        return;
      }
      notices.slice().reverse().forEach(notice => {
        const card = document.createElement('article');
        card.className = 'notice-card';
        const title = document.createElement('h3');
        title.textContent = notice.title;
        const content = document.createElement('p');
        content.textContent = notice.content || 'Image notice';
        const author = document.createElement('small');
        author.textContent = `Published by ${notice.teacherName} on ${new Date(notice.createdAt).toLocaleString()}`;
        card.append(title, content);
        if (notice.image) {
          const image = document.createElement('img');
          image.className = 'notice-image';
          image.src = notice.image;
          image.alt = notice.title;
          card.appendChild(image);
        }
        card.appendChild(author);
        noticeList.appendChild(card);
      });
    }
    noticeForm.addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.getElementById('notice-title').value.trim();
      const content = document.getElementById('notice-content').value.trim();
      const imageFile = imageInput.files[0];
      if (!content && !imageFile) {
        status.textContent = 'Add notice text or choose an image before publishing.';
        status.style.display = 'block';
        status.style.color = '#9a3412';
        status.style.background = '#ffedd5';
        return;
      }
      try {
        const notices = JSON.parse(localStorage.getItem('notices') || '[]');
        notices.push({ id: Date.now().toString(), title, content, image: await readImage(imageFile), teacherName: teacherAccount.fullName, teacherEmail: teacherAccount.email, createdAt: new Date().toISOString() });
        localStorage.setItem('notices', JSON.stringify(notices));
        noticeForm.reset();
        status.textContent = 'Notice published successfully.';
        status.style.display = 'block';
        status.style.color = '#155e35';
        status.style.background = '#dcfce7';
        renderNotices();
      } catch (error) {
        status.textContent = error.message;
        status.style.display = 'block';
        status.style.color = '#9a3412';
        status.style.background = '#ffedd5';
      }
    });
    renderNotices();
  </script>
  <script type="module">
    import { saveNotice } from './firebase-data.js';
    document.getElementById('notice-form').addEventListener('submit', async event => {
      event.preventDefault();
      event.stopImmediatePropagation();
      const form = event.currentTarget;
      const account = JSON.parse(localStorage.getItem('teacherAccount') || 'null');
      const file = document.getElementById('notice-image').files[0];
      const title = document.getElementById('notice-title').value.trim();
      const content = document.getElementById('notice-content').value.trim();
      const status = document.getElementById('status');
      try {
        let image = '';
        if (file) image = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
        if (!content && !image) throw new Error('Add notice text or choose an image before publishing.');
        await saveNotice({ id: Date.now().toString(), title, content, image, teacherName: account.fullName, teacherEmail: account.email, createdAt: new Date().toISOString() });
        form.reset();
        status.textContent = 'Notice published for all students.';
        status.style.display = 'block';
      } catch (error) { status.textContent = error.message; status.style.display = 'block'; }
    }, true);
  </script>
</body>
</html>
