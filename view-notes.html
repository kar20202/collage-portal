<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Notes | Student Portal</title>
  <style>
    :root { --navy: #14213d; --blue: #2563eb; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 38px 24px; color: var(--navy); font-family: Arial, sans-serif; background: linear-gradient(135deg, #dcecff, #fff3d6); }
    main { width: min(100%, 850px); margin: 0 auto; padding: 42px; background: #fff; border-radius: 14px; box-shadow: 0 20px 50px rgba(20, 33, 61, 0.14); }
    h1 { font: 500 2.5rem Georgia, serif; }
    .intro { margin: 10px 0 28px; color: var(--muted); line-height: 1.6; }
    label { display: block; margin-bottom: 7px; color: var(--navy); font-weight: bold; font-size: 0.9rem; }
    select { width: 100%; margin-bottom: 26px; padding: 13px; border: 1px solid #d8e2f0; border-radius: 7px; background: #fff; font: 1rem Arial, sans-serif; }
    select:focus { border-color: var(--blue); outline: 2px solid rgba(37, 99, 235, 0.15); }
    .note-list { display: grid; gap: 16px; }
    .note-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 20px; border: 1px solid #d8e2f0; border-radius: 10px; }
    .note-card h2 { margin-bottom: 8px; font: 500 1.25rem Georgia, serif; }
    .note-card p { color: var(--muted); line-height: 1.55; }
    .note-meta { margin-top: 10px; color: var(--muted); font-size: 0.86rem; line-height: 1.6; }
    .note-preview { display: block; max-width: 180px; max-height: 130px; margin-top: 12px; border-radius: 7px; }
    .view-link { align-self: center; padding: 11px 14px; color: #fff; background: var(--blue); border-radius: 7px; font-size: 0.9rem; text-decoration: none; white-space: nowrap; }
    .empty { padding: 20px; color: var(--muted); background: #f4f7fb; border-radius: 8px; }
    .back { display: inline-block; margin-top: 26px; color: var(--blue); text-decoration: none; }
    @media (max-width: 600px) { main { padding: 28px; } .note-card { grid-template-columns: 1fr; } .view-link { justify-self: start; } }
  </style>
</head>
<body>
  <main>
    <h1>View Notes</h1>
    <p class="intro">Notes shared by your teachers, including the subject and teacher name.</p>
    <label for="subject-filter">Select subject</label>
    <select id="subject-filter">
      <option value="all">All subjects</option>
      <option>Math</option>
      <option>Physics</option>
      <option>Chemistry</option>
      <option>FEEE</option>
      <option>Engineering Graphics</option>
    </select>
    <section id="note-list" class="note-list" aria-live="polite"></section>
    <a class="back" href="student-dash.html">Back to student dashboard</a>
  </main>
  <script>
    const noteList = document.getElementById('note-list');
    const filter = document.getElementById('subject-filter');
    let notes = [];
    const databaseRequest = indexedDB.open('schoolPortal', 1);
    databaseRequest.onupgradeneeded = event => event.target.result.createObjectStore('notes', { keyPath: 'id' });
    const databaseReady = new Promise((resolve, reject) => {
      databaseRequest.onsuccess = event => resolve(event.target.result);
      databaseRequest.onerror = reject;
    });
    function loadNotes() {
      return databaseReady.then(database => new Promise((resolve, reject) => {
        const request = database.transaction('notes', 'readonly').objectStore('notes').getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = reject;
      }));
    }
    function subjectKey(subject) {
      const value = String(subject || '').trim().toLowerCase();
      return value === 'mathematics' ? 'math' : value;
    }
    async function renderNotes() {
      notes = await loadNotes();
      const selectedSubject = filter.value;
      const visibleNotes = notes.filter(note => selectedSubject === 'all' || subjectKey(note.subject) === subjectKey(selectedSubject));
      noteList.innerHTML = '';
      if (!visibleNotes.length) {
        noteList.innerHTML = '<p class="empty">No notes have been published for this subject yet.</p>';
        return;
      }
      visibleNotes.slice().reverse().forEach(note => {
        const card = document.createElement('article');
        card.className = 'note-card';
        const content = document.createElement('div');
        const title = document.createElement('h2');
        title.textContent = note.fileName;
        const description = document.createElement('p');
        description.textContent = 'Study material shared by your teacher.';
        const meta = document.createElement('p');
        meta.className = 'note-meta';
        meta.textContent = `Teacher: ${note.teacherName} | Subject: ${note.subject} | Published: ${new Date(note.createdAt).toLocaleString()}`;
        content.append(title, description, meta);
        if (note.fileType && note.fileType.startsWith('image/')) {
          const image = document.createElement('img');
          image.className = 'note-preview';
          image.src = URL.createObjectURL(note.file);
          image.alt = note.fileName;
          content.appendChild(image);
        }
        const link = document.createElement('a');
        link.className = 'view-link';
        link.href = URL.createObjectURL(note.file);
        link.target = '_blank';
        link.rel = 'noopener';
        link.download = note.fileName;
        link.textContent = note.fileType && note.fileType.startsWith('image/') ? 'Open image' : 'View / download';
        card.append(content, link);
        noteList.appendChild(card);
      });
    }
    filter.addEventListener('change', renderNotes);
    renderNotes();
  </script>
  <script type="module">
    import { watchNotes } from './firebase-data.js';
    watchNotes(remoteNotes => {
      const notes = Object.values(remoteNotes);
      const next = JSON.stringify(notes);
      if (localStorage.getItem('notes') !== next) { localStorage.setItem('notes', next); window.location.reload(); }
    });
  </script>
</body>
</html>
